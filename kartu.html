<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kartu Rasi Bintang - Eyy Joki Genshin</title>
<meta name="description" content="Cek kartu rasi bintang dan hadiah loyalitasmu di Eyy Joki Genshin.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Quattrocento+Sans:wght@400;700" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stars" aria-hidden="true"></div>

<header>
  <div class="wrap">
    <a class="brand" href="index.html">☾ Eyy Joki Genshin</a>
    <div id="social" class="social"></div>
  </div>
</header>

<main class="wrap" style="padding:24px 0 72px">
  <h1>Kartu rasi bintang</h1>
  <p class="muted" style="max-width:34rem">Masukkan kode member untuk melihat berapa bintang yang sudah menyala di kartumu.</p>

  <form id="cardForm" class="lookup">
    <label>Kode member
      <input id="code" type="text" placeholder="EYY-0001" autocomplete="off" required>
    </label>
    <button class="btn" type="submit">Cek kartu</button>
  </form>
  <p id="msg" class="note" role="status" aria-live="polite" style="margin-top:14px"></p>

  <div id="card" class="cardbox" hidden></div>

  <section style="margin-top:56px">
    <h2>Cara kerja</h2>
    <ul id="rules" class="rules"></ul>
  </section>

  <p style="margin-top:32px"><a class="muted" href="index.html">Kembali ke beranda</a></p>
</main>

<footer>
  <div class="wrap">
    <p>© 2026 Eyy Joki Genshin. Tidak berafiliasi dengan HoYoverse. Genshin Impact adalah merek dagang HoYoverse.</p>
  </div>
</footer>

<script src="config.js"></script>
<script src="site.js"></script>
<script>
var DATA = null;
var msg = document.getElementById("msg");
var box = document.getElementById("card");
var input = document.getElementById("code");

function esc(t) {
  return String(t).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

function points(n) {
  var a = [];
  for (var i = 0; i < n; i++) a.push([30 + i * (300 / (n - 1)), 115 + 48 * Math.sin(i * 1.7)]);
  return a;
}

function show(raw) {
  var code = raw.trim().toUpperCase();
  var m = DATA.members[code];
  if (!m) {
    box.hidden = true;
    msg.innerHTML = 'Kode tidak ditemukan. Cek penulisannya, atau <a href="' +
      waLink("Halo Eyy, kode member saya tidak ketemu: " + code) +
      '" target="_blank" rel="noopener">tanya lewat WhatsApp</a>.';
    return;
  }
  msg.textContent = "";
  var total = DATA.total || 8;
  var n = Math.max(0, Math.min(m.stamps || 0, total));
  var p = points(total);
  var svg = '<svg viewBox="0 0 360 220" role="img" aria-label="' + n + ' dari ' + total + ' bintang menyala">';
  for (var i = 0; i < total - 1; i++) {
    svg += '<line class="ln' + (n > i + 1 ? " on" : "") + '" style="animation-delay:' + (i * 0.35) + 's" x1="' + p[i][0] + '" y1="' + p[i][1] + '" x2="' + p[i + 1][0] + '" y2="' + p[i + 1][1] + '"/>';
  }
  for (var j = 0; j < total; j++) {
    var on = n > j;
    svg += '<circle class="sd' + (on ? " on" : "") + '" style="animation-delay:' + (j * 0.3) + 's" cx="' + p[j][0] + '" cy="' + p[j][1] + '" r="' + (on ? 7 : 5) + '"/>';
  }
  svg += "</svg>";
  var left = total - n;
  var status = left <= 0 ? "Rasi lengkap! Kamu berhak atas hadiah akhir." : n + " dari " + total + " bintang menyala. " + left + " order lagi untuk melengkapi rasi.";
  var rew = (DATA.rewards || []).map(function (r) {
    var got = n >= r.at;
    return '<li class="' + (got ? "got" : "") + '"><span>' + esc(r.text) + "</span><b>" + (got ? "Tercapai" : "Butuh " + (r.at - n) + " bintang lagi") + "</b></li>";
  }).join("");
  box.innerHTML = '<div class="ch"><h2>Kartu kamu</h2><span class="code">' + esc(code) + "</span></div>" + svg +
    '<p class="status-text">' + status + '</p><ul class="rew">' + rew + "</ul>";
  box.hidden = false;
}

fetch("members.json", { cache: "no-store" })
  .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
  .then(function (d) {
    DATA = d;
    document.getElementById("rules").innerHTML = (d.rules || []).map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("");
    var pre = new URLSearchParams(location.search).get("kode");
    if (pre) { input.value = pre; show(pre); }
  })
  .catch(function () {
    msg.textContent = "Data kartu belum bisa dimuat. Coba lagi nanti.";
  });

document.getElementById("cardForm").addEventListener("submit", function (e) {
  e.preventDefault();
  if (DATA) show(input.value);
});
</script>
</body>
</html>
